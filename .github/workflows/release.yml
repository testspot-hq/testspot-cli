name: CLI release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux_amd64, file: testspot_linux_amd64 }
          - { runner: ubuntu-24.04-arm, target: linux_arm64, file: testspot_linux_arm64 }
          - { runner: macos-15-intel, target: darwin_amd64, file: testspot_darwin_amd64 }
          - { runner: macos-15, target: darwin_arm64, file: testspot_darwin_arm64 }
          - { runner: windows-2025, target: windows_amd64, file: testspot_windows_amd64.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run typecheck
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: node -e 'if(process.env.REF_TYPE === "tag" && process.env.RELEASE_TAG !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm run build:executables -- ${{ matrix.target }}
      - run: node --test tests/smoke.mjs
        env:
          CLI_EXECUTABLE: dist/release/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: cli/dist/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Assemble checksums
        run: cat release/SHA256SUMS-* > release/SHA256SUMS
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/testspot_* release/SHA256SUMS release/THIRD_PARTY_NOTICES.md --verify-tag --title "TestSpot CLI $RELEASE_TAG" --generate-notes
